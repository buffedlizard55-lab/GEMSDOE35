[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe35"
version = "0.1.0"
description = "Auditable DOE GEMS fault-mapping experiments, holdout gates, and GeoTIFF submission builder"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
